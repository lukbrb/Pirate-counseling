name: Pirate Counseling

on: [push]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # os: [ubuntu-latest, macos-latest, windows-latest]
        os: [macos-latest]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests customtkinter pyinstaller

    - name: Build executable
      run: |
        python -m PyInstaller --onefile listener_api_preprompted_with_GUI.py
        mv dist/listener_api_preprompted_with_GUI ./dist/pirate_counseling

    - name: Upload release asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./dist/pirate_counseling
        asset_name: pirate_counseling
        asset_content_type: application/octet-stream

